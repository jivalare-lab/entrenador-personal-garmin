name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate example profile
        run: python3 scripts/validate_profile.py profile/athlete.example.toml
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Confirm private files are not tracked
        run: |
          if git ls-files | grep -E '(^|/)(athlete\.toml|\.env($|\.)|garmin_tokens\.json|\.garminconnect_base64|.*\.log)$'; then
            echo "Sensitive or private file is tracked"
            exit 1
          fi
